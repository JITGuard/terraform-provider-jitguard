version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    groups:
      hashicorp:
        patterns:
          - "github.com/hashicorp/*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      semantic-release:
        patterns:
          - "semantic-release"
          - "@semantic-release/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns:
          - "actions/*"
      aws-actions:
        patterns:
          - "aws-actions/*"
      hashicorp:
        patterns:
          - "hashicorp/*"
      release:
        patterns:
          - "goreleaser/*"
          - "amannn/*"
