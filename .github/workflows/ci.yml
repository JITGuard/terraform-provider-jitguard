name: CI

# Verify the JIT Guard Terraform provider on every pull request and push.
# Publishing is handled by release.yml from main (or the next prerelease branch).

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Run the OSS CLI rather than the licensed action so fork PRs (which
      # never receive repository secrets) are scanned too.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Gitleaks — secret scanning
        run: gitleaks detect --source . --config jitguard-api-key.toml --redact --no-banner

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Validate Registry manifest
        run: |
          jq -e '.version == 1 and .metadata.protocol_versions == ["6.0"]' terraform-registry-manifest.json

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive example

      - name: Verify docs are up to date
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0 generate
          test -z "$(git status --porcelain docs/)" || { echo "docs/ is out of date — run 'make docs' and commit"; exit 1; }

  test:
    name: Test (Terraform ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported floor plus the current release used by the example.
        terraform: ["1.11.x", "1.14.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      # TF_ACC runs the framework acceptance tests against the in-process fake
      # machine API. No credentials or network are required.
      - name: Test
        run: TF_ACC=1 go test ./...

  release-config:
    name: Release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate semantic-release config
        run: node -e "JSON.parse(require('fs').readFileSync('.releaserc.json', 'utf8'))"

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
