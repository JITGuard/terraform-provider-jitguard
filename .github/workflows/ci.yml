name: CI

# Verify the JIT Guard Terraform provider on pull requests and pushes.
# Publishing is handled separately by release.yml on version tags.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action reads PR commits/files on pull_request events.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secret scan
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Dependabot PRs are gated out: GitHub withholds all Actions secrets from
      # dependabot-triggered pull_request runs, so GITLEAKS_LICENSE is empty and
      # gitleaks-action v3 hard-errors on an org repo. Dependabot only touches
      # dependency manifests, and the push-to-main run scans the merge commit.
      - name: Gitleaks — secret scanning
        if: github.actor != 'dependabot[bot]'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: jitguard-api-key.toml

  verify:
    name: Verify
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0
          terraform_wrapper: false

      - name: Verify docs are up to date
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.21.0 generate
          test -z "$(git status --porcelain docs/)" || { echo "docs/ is out of date — run 'make docs' and commit"; exit 1; }
