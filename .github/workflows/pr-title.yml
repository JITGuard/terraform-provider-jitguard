name: PR title

# semantic-release reads the squashed commit message, which is the PR title.
# Enforce Conventional Commits before a title can land on main.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          # A breaking change is a deliberate claim about the provider API;
          # the reviewer must add `!` or a BREAKING CHANGE footer.
